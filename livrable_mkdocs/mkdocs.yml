site_name: HRNova
site_description: Démarrer et comprendre l’API de prédiction HRNova.
site_url: ''
repo_url: https://github.com/samuelGabbai/P5_Futurisys
repo_name: Voir le dépôt GitHub
edit_uri: blob/main/docs/
dev_addr: 127.0.0.1:8001
theme:
  name: material
  language: fr
  font: false
  logo: assets/hrnova-mark.svg
  favicon: assets/hrnova-mark.svg
  palette:
    - scheme: default
      primary: teal
      accent: cyan
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
  icon:
    repo: fontawesome/brands/github
extra_css:
  - stylesheets/extra.css
plugins:
  - search:
      lang: fr
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    omitted_files: ignore
    not_found: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Accueil: index.md
  - Démarrer de zéro: demarrage.md
  - Utiliser l’API: api.md
  - Comprendre le modèle: model.md
  - Base et accès: database.md
  - Déploiement: deployment.md
  - Présentation: presentation.md
  - Guides détaillés: ressources.md
