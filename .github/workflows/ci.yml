name: CI Python

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests et construction du package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hrnova_test:hrnova_test@127.0.0.1:5432/hrnova_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hrnova_test
          POSTGRES_PASSWORD: hrnova_test
          POSTGRES_DB: hrnova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrnova_test -d hrnova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer uv et Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installer les dépendances verrouillées
        run: uv sync --locked --extra api --extra dev

      - name: Exécuter les tests et mesurer la couverture
        run: uv run --no-sync pytest --cov-report=xml --junitxml=reports/junit.xml

      - name: Conserver les rapports de tests
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/junit.xml
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: warn

      - name: Construire le package Python
        run: uv build

      - name: Conserver le package
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 14
          if-no-files-found: error

  merge-validation:
    name: Validation avant fusion
    if: ${{ always() }}
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier le résultat de la CI
        env:
          CI_RESULT: ${{ needs.test-and-build.result }}
        run: |
          if [ "$CI_RESULT" != "success" ]; then
            echo "La fusion exige des tests et une construction réussis."
            exit 1
          fi

  environment-validation:
    name: Validation de l'environnement
    needs: test-and-build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hrnova_test
          POSTGRES_PASSWORD: hrnova_test
          POSTGRES_DB: hrnova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrnova_test -d hrnova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/develop' && 'staging' || 'development' }}
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hrnova_test:hrnova_test@127.0.0.1:5432/hrnova_test
      HRNOVA_MODEL_PATH: ${{ vars.HRNOVA_MODEL_PATH || 'artifacts/turnover_model.joblib' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer uv et Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installer les dépendances verrouillées
        run: uv sync --locked --extra api --extra dev

      - name: Valider la configuration et les tests dans l'environnement cible
        run: |
          uv run --no-sync python -c 'import os; from pathlib import Path; assert os.environ["HRNOVA_MODEL_PATH"].strip(), "HRNOVA_MODEL_PATH doit être renseigné"; assert Path(os.environ["HRNOVA_MODEL_PATH"]).suffix == ".joblib", "Le modèle doit être un fichier .joblib"'
          uv run --no-sync pytest --no-cov
